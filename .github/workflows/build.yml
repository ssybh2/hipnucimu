name: Build 6-IMU Firmware

# CI trigger for the stable 500 Hz baseline and the 333 Hz A/B branch.
on:
  push:
    branches:
      - "feature/6imu-500hz-stable"
      - "feature/6imu-333hz-stable"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify 333 Hz forwarding contract
        if: github.ref_name == 'feature/6imu-333hz-stable'
        run: python3 tests/test_333hz_forwarding_contract.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure CMake
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -S ${{ github.workspace }} \
            -B ${{ github.workspace }}/build/Release

      - name: Build all three IMU slots
        run: |
          cmake --build ${{ github.workspace }}/build/Release \
            --target hipnucimu_all_slots

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hipnucimu-500hz-slots
          path: |
            ${{ github.workspace }}/build/Release/hipnucimu_slot1.hex
            ${{ github.workspace }}/build/Release/hipnucimu_slot1.bin
            ${{ github.workspace }}/build/Release/hipnucimu_slot2.hex
            ${{ github.workspace }}/build/Release/hipnucimu_slot2.bin
            ${{ github.workspace }}/build/Release/hipnucimu_slot3.hex
            ${{ github.workspace }}/build/Release/hipnucimu_slot3.bin
