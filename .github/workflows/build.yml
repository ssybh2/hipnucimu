name: Build Firmware

on:
  push:
    branches: [ "main", "feature/6imu-500hz-stable" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure CMake
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
            -S ${{ github.workspace }} \
            -B ${{ github.workspace }}/build/Release

      - name: Build all three IMU slots
        run: |
          cmake --build ${{ github.workspace }}/build/Release \
            --target hipnucimu_all_slots

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hipnucimu-500hz-slots
          path: |
            ${{ github.workspace }}/build/Release/hipnucimu_slot1.hex
            ${{ github.workspace }}/build/Release/hipnucimu_slot1.bin
            ${{ github.workspace }}/build/Release/hipnucimu_slot2.hex
            ${{ github.workspace }}/build/Release/hipnucimu_slot2.bin
            ${{ github.workspace }}/build/Release/hipnucimu_slot3.hex
            ${{ github.workspace }}/build/Release/hipnucimu_slot3.bin
